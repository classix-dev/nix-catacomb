# Build the static UI derivation and push every store path to cachix.
# Consumers of this flake (the deploy repo, dev karts) configure
# `https://classix.cachix.org` as a substituter via the flake's
# `nixConfig` block and pull cached results.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v16
        with:
          name: classix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: nix flake check
        run: nix flake check --accept-flake-config --print-build-logs

      - name: build static UI
        run: nix build .#safe-wallet-web-static --accept-flake-config --print-build-logs
