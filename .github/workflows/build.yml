# Build the static UI derivation and push every store path to cachix.
# Consumers of this flake (the deploy repo, dev karts) configure
# `https://classix.cachix.org` as a substituter via the flake's
# `nixConfig` block and pull cached results.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GH-hosted runners ship with ~7 GB RAM and a pre-existing
      # `/swapfile` we can't touch ("Text file busy"). Add our own on
      # the larger `/mnt` partition. `next build`'s prerender phase
      # peaks past 5 GB of heap; without extra swap the kernel
      # OOM-kills it before the bundle is generated.
      - name: Add 8 GB swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v16
        with:
          name: classix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: nix flake check
        run: nix flake check --accept-flake-config --print-build-logs

      - name: build static UI
        run: nix build .#safe-wallet-web-static --accept-flake-config --print-build-logs
